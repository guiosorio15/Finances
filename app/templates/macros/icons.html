{% macro icon(name, size=20, class_name="") -%}
<svg class="icon {{ class_name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ ICONS.get(name, ICONS['more'])|safe }}</svg>
{%- endmacro %}
